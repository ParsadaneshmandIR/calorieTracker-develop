spring:
  application:
    name: calorie-tracker
  datasource:
    url: jdbc:h2:file:./data/calorie-tracker;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;AUTO_SERVER=TRUE;AUTO_SERVER_PORT=9092
    driver-class-name: org.h2.Driver
    username: sa
    password:
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  cache:
    type: caffeine
    caffeine:
      spec: maximumSize=500,expireAfterWrite=1h
  jackson:
    serialization:
      write-bigdecimal-as-plain: true
  thymeleaf:
    cache: false
  messages:
    basename: messages
    encoding: UTF-8


server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when_authorized

usda:
  api-key: ${USDA_API_KEY:}
  base-url: https://api.nal.usda.gov/fdc/v1

open-food-facts:
  base-url: https://world.openfoodfacts.org
  user-agent: "PersianCalorieTracker/1.0 (contact: ${OFF_USER_AGENT_EMAIL:dev@localhost})"
  max-requests-per-minute: 10

app:
  admin:
    username: ${ADMIN_USERNAME:admin}
    password: ${ADMIN_PASSWORD:admin}
  import:
    usda: false

logging:
  level:
    com.parsa.calorietracker: INFO
