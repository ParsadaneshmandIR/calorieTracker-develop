spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:calorie_tracker}
    username: ${DB_USER:calorie}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  h2:
    console:
      enabled: false
  jpa:
    hibernate:
      ddl-auto: validate
  thymeleaf:
    cache: true

logging:
  level:
    root: WARN
    com.parsa.calorietracker: INFO
