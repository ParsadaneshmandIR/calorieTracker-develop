services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: calorie_tracker
      POSTGRES_USER: calorie
      POSTGRES_PASSWORD: ${DB_PASSWORD:-calorie}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U calorie -d calorie_tracker"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: calorie_tracker
      DB_USER: calorie
      DB_PASSWORD: ${DB_PASSWORD:-calorie}
      USDA_API_KEY: ${USDA_API_KEY:-}
      OFF_USER_AGENT_EMAIL: ${OFF_USER_AGENT_EMAIL:-dev@localhost}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin}
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
